<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>文档分享站</title>
<script src="https://unpkg.com/mammoth@1.4.16/mammoth.browser.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#f5f7fa;font-family:微软雅黑;}
.top{background:#2c7be5;color:#fff;padding:22px;text-align:center;}
.top h1{font-size:24px;}
#search{margin-top:15px;width:88%;max-width:480px;padding:10px;border-radius:25px;border:none;outline:none;}
.wrap{max-width:1200px;margin:25px auto;padding:0 15px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}
.item{background:#fff;padding:16px;border-radius:10px;box-shadow:0 2px 6px #ddd;cursor:pointer;transition:0.2s;}
.item:hover{transform:translateY(-4px);}
.icon{font-size:42px;color:#2c7be5;margin-bottom:8px;}

/* 预览弹窗 */
.pop{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;z-index:9999;padding:15px;}
.pop.show{display:flex;align-items:center;justify-content:center;}
.doc-box{width:100%;max-width:900px;height:85vh;background:#fff;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;}
.bar{display:flex;justify-content:space-between;padding:12px 15px;border-bottom:1px solid #eee;}
.close{border:none;background:#2c7be5;color:#fff;padding:5px 14px;border-radius:5px;cursor:pointer;}
.content{flex:1;padding:20px;overflow:auto;line-height:1.8;font-size:15px;}
</style>
</head>
<body>
<div class="top">
    <h1>文档资源分享</h1>
    <input id="search" placeholder="搜索文档名称">
</div>

<div class="wrap" id="list"></div>

<div class="pop" id="popBox">
    <div class="doc-box">
        <div class="bar">
            <span id="docName">文档预览</span>
            <button class="close" onclick="hideDoc()">关闭</button>
        </div>
        <div class="content" id="docHtml">加载中...</div>
    </div>
</div>

<script>
// 在这里填写文档 格式：文件名必须和仓库一致
let docList = [
    {
        name:"第11周周末听说套题练习",
        path:"docs/11.docx"
    }
];

let listDom = document.getElementById("list");
let pop = document.getElementById("popBox");
let docHtml = document.getElementById("docHtml");
let docName = document.getElementById("docName");

// 渲染列表
function render(arr){
    listDom.innerHTML = "";
    arr.forEach(item=>{
        listDom.innerHTML += `
        <div class="item" onclick="openDoc('${item.path}','${item.name}')">
            <div class="icon">📑</div>
            <h3>${item.name}</h3>
        </div>
        `
    })
}

// 打开预览
async function openDoc(filePath,title){
    docName.innerText = title;
    pop.classList.add("show");
    docHtml.innerHTML = "<p style='color:#666'>正在解析文档...</p>";
    try{
        let res = await fetch(filePath);
        let arrayBuffer = await res.arrayBuffer();
        let result = await mammoth.convertToHtml({arrayBuffer:arrayBuffer});
        docHtml.innerHTML = result.value;
    }catch(e){
        docHtml.innerHTML = `
        <p style="color:red;text-align:center">
            加载失败！<br>
            1.确认文档上传到 docs 文件夹<br>
            2.文件名、后缀完全一致<br>
            3.建议文件名只用英文/数字
        </p>
        `;
    }
}

// 关闭弹窗
function hideDoc(){
    pop.classList.remove("show");
    docHtml.innerHTML = "";
}

// 点击弹窗空白关闭
pop.onclick = e=>{
    if(e.target === pop) hideDoc();
}

// 搜索
document.getElementById("search").oninput = e=>{
    let key = e.target.value;
    let filter = docList.filter(v=>v.name.includes(key));
    render(filter);
}

// 初始化
render(docList);
</script>
</body>
</html>
